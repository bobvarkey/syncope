const uploadedECGNotes = {"lvh": 'Uploaded image illustrates an HOCM-associated Q-wave pattern, not a general LVH voltage criterion.', "bifasc": 'These images show left anterior and left posterior fascicular block separately. Bifascicular block usually requires associated RBBB; neither image alone establishes bifascicular block.'};
function suppliedECGFigure(id){const key=aliases[id]||id;const figures=uploadedECGImages[key];if(!figures)return "";return `<div class="reference-images">${figures.map(f=>`<figure class="ecg-figure"><img src="${f.src}" alt="Uploaded ECG reference: ${esc(f.label)}" loading="lazy"><figcaption>Supplied ECG reference: ${esc(f.label)}</figcaption></figure>`).join("")}${uploadedECGNotes[key]?`<p class="ecg-note"><strong>Interpretation note:</strong> ${esc(uploadedECGNotes[key])}</p>`:""}</div>`;}
const aliases={w1:'wpw',w2:'wellens',o:'mobitz',b1:'bifasc',b2:'brugada',l:'lvh',e:'epsilon',r:'longqt'};
function ecgFigure(id){let spec=ecgMap[aliases[id]||id];if(!spec)return '';
 let grid='';for(let x=0;x<=400;x+=10)grid+=`<line x1="${x}" y1="0" x2="${x}" y2="120" class="${x%50===0?'major':'gridline'}"/>`;
 for(let y=0;y<=120;y+=10)grid+=`<line x1="0" y1="${y}" x2="400" y2="${y}" class="${y%50===0?'major':'gridline'}"/>`;
 let labels=id==='bifasc'?'<text x="12" y="17">V1: RSR′</text><text x="212" y="17">Frontal axis: leftward</text>':'';
 return `<figure class="ecg-figure"><svg role="img" aria-label="Schematic ECG showing ${esc(spec[0])}" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid meet"><rect width="400" height="120" fill="#fffafa"/>${grid}<path class="wave" d="${spec[1]}"/>${labels}</svg><figcaption>${esc(spec[0])} · schematic, not a diagnostic tracing</figcaption></figure>`;
}

const steps=[
{title:'Patient & safety screen',hint:'Before applying the pattern checklist: identify instability, obvious acute ischaemia, and sustained arrhythmia. A normal ECG does not rule out cardiac syncope.',items:[['unstable','Haemodynamic instability / ongoing chest pain / severe dyspnoea','Immediate clinical assessment and emergency management.','red'],['syncope','High-risk clinical features','Exertional or supine syncope, preceding palpitations, family history of sudden cardiac death, known structural heart disease.','urgent']]},
{title:'1 · Rate & rhythm',hint:'Look at the rhythm strip first. Record rate, regularity, P–QRS association and pauses.',items:[['brady','Marked bradycardia, sinus arrest or pauses','Consider sinus node dysfunction; correlate with symptoms and monitoring.','urgent'],['tachy','Sustained tachyarrhythmia / VT','Assess instability and manage urgently.','red'],['flutter','Sawtooth flutter waves','Consider atrial flutter; assess atrial activity and AV conduction.',''],['avdis','AV dissociation / complete heart block','High-risk conduction abnormality; urgent cardiac assessment.','red']]},
{title:'2 · P wave & PR',hint:'Inspect leads II and V1; measure PR and identify dropped beats.',items:[['wpw','Short PR (<120 ms) with delta wave','Pre-excitation / WPW pattern; widened slurred QRS onset.','urgent'],['prlong','Prolonged PR (>200 ms)','First-degree AV block; interpret in clinical context.',''],['mobitz','Dropped QRS / Mobitz II / high-grade AV block','Important cause of intermittent syncope.','red']]},
{title:'3 · QRS & structure',hint:'Measure QRS duration and axis. Inspect V1–V3 and assess LVH or pathological Q waves.',items:[['bifasc','Bifascicular block','Typically RBBB with left anterior or posterior fascicular block; consider intermittent advanced AV block.','urgent'],['lvh','LVH / features suggesting structural disease','Consider aortic stenosis or hypertrophic cardiomyopathy; ECG alone cannot diagnose either.','urgent'],['epsilon','Epsilon wave','Small deflection after QRS, often V1–V3; possible arrhythmogenic cardiomyopathy.','urgent'],['alternans','Electrical alternans','Beat-to-beat QRS amplitude variation; consider large pericardial effusion and other causes.','urgent']]},
{title:'4 · ST segment & J point',hint:'Screen for acute coronary occlusion first, then right-precordial and J-point patterns.',items:[['stemi','ST elevation / significant ischaemic changes','Assess for acute coronary syndrome / occlusion; use clinical context and serial ECGs.','red'],['dewinter','De Winter pattern','Upsloping ST depression at J point with tall symmetrical precordial T waves; acute coronary occlusion pattern.','red'],['brugada','Type 1 Brugada ECG pattern','Coved ST elevation ≥2 mm in right precordial leads followed by negative T wave.','urgent'],['osborn','Osborn (J) wave','Notch/hump at QRS–ST junction; classically hypothermia, but not specific.','']]},
{title:'5 · T waves & U waves',hint:'Check anterior T-wave morphology and electrolyte-related repolarisation changes.',items:[['wellens','Wellens pattern','Biphasic or deeply inverted anterior T waves in appropriate recent-angina context; avoid stress testing.','red'],['tchange','Peaked / flattened / inverted T waves','Consider ischaemia, electrolyte disturbances and other causes.',''],['uwave','Prominent U waves','Consider hypokalaemia, bradycardia or medication effect.','']]},
{title:'6 · QTc & repolarisation',hint:'Measure QT and calculate QTc. Check medications and electrolytes. Automated QTc may require manual verification.',items:[['longqt','Prolonged QTc','Especially QTc ≥500 ms: increased torsades risk; assess drugs, electrolytes and clinical context.','urgent'],['shortqt','Short QTc','Consider short-QT syndrome or acquired metabolic causes; confirm measurement.','urgent']]},
{title:'WOBBLER final check',hint:'A mnemonic cross-check, not a substitute for sequential ECG interpretation.',items:[['w1','W · Wolff–Parkinson–White','Short PR / delta wave.',''],['w2','W · Wellens','Anterior T-wave pattern.',''],['o','O · Obstructed AV conduction','PR, dropped beats, high-grade AV block.',''],['b1','B · Bifascicular block','QRS and axis.',''],['b2','B · Brugada','Coved right-precordial ST elevation.',''],['l','L · LVH / structural heart disease','LVH; consider AS/HCM clinically.',''],['e','E · Epsilon wave','Terminal QRS / early ST.',''],['r','R · Repolarisation / QT','Long or short QT.','']]},
{title:'Clinical summary & export',hint:'Review flagged findings, document the interpretation, and export or print the assessment.',items:[]}
];let state={answers:{},patient:{},notes:'',clinical:''},index=0;try{let saved=JSON.parse(localStorage.getItem('syncopeECG_v1'));if(saved && saved.answers && saved.patient)state=saved}catch(e){};function save(){try{localStorage.setItem('syncopeECG_v1',JSON.stringify(state))}catch(e){/* Private or file browser storage unavailable; app remains usable */}}const all=steps.flatMap(s=>s.items);function count(){return all.filter(x=>state.answers[x[0]]).length}function el(id){return document.getElementById(id)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(){el('nav').innerHTML=steps.map((s,i)=>`<button class="nav ${i===index?'active':''}" onclick="go(${i})">${esc(s.title)} <small>${s.items.filter(x=>state.answers[x[0]]).length}/${s.items.length}</small></button>`).join('');el('bar').style.width=Math.round(100*count()/all.length)+'%';el('progressText').textContent=`${count()} of ${all.length} findings reviewed`};function setAnswer(id,val){state.answers[id]=val;save();render()}function setField(k,v){state.patient[k]=v;save()}function setNotes(k,v){state[k]=v;save()}function go(i){index=Math.max(0,Math.min(steps.length-1,i));render();window.scrollTo({top:0,behavior:'smooth'})}function resetAll(){if(confirm('Clear all entered patient data and ECG findings?')){state={answers:{},patient:{},notes:'',clinical:''};save();go(0)}}function render(){nav();let s=steps[index];let html=`<div class="stephead"><div><span class="micro">STEP ${index+1} / ${steps.length}</span><h2>${esc(s.title)}</h2></div><span class="micro">${s.items.filter(x=>state.answers[x[0]]).length}/${s.items.length} reviewed</span></div><div class="hint">${esc(s.hint)}</div>`;if(index===0)html+=`<div class="grid">${[['name','Patient / identifier'],['date','Assessment date'],['rate','Heart rate (bpm)'],['pr','PR (ms)'],['qrs','QRS (ms)'],['qtc','QTc (ms)']].map(([k,l])=>`<div class="field"><label>${l}</label><input type="${k==='date'?'date':'text'}" value="${esc(state.patient[k]||'')}" oninput="setField('${k}',this.value)"></div>`).join('')}</div>`;if(index===steps.length-1){let flagged=all.filter(x=>state.answers[x[0]]==='present');let urgent=flagged.filter(x=>x[3]==='urgent'||x[3]==='red');html+=`<h3>Positive / abnormal findings (${flagged.length})</h3>`+(flagged.length?flagged.map(x=>`<div class="${x[3]?'alert':'summaryitem'}"><b>${esc(x[1])}</b><p>${esc(x[2])}</p></div>`).join(''):'<div class="safe">No positive findings marked. This does not exclude arrhythmic or structural cardiac syncope.</div>');if(urgent.length)html+=`<div class="alert"><strong>${urgent.length} potentially important finding(s) flagged.</strong> Prioritise clinical review according to symptoms and haemodynamic status.</div>`;html+=`<label for="clinical"><b>Clinical context / symptoms</b></label><textarea id="clinical" oninput="setNotes('clinical',this.value)">${esc(state.clinical)}</textarea><label for="notes"><b>ECG interpretation / plan</b></label><textarea id="notes" oninput="setNotes('notes',this.value)">${esc(state.notes)}</textarea><div class="actions"><button class="btn primary" onclick="printReport()">Print / Save PDF</button><button class="btn" onclick="exportJSON()">Export JSON</button><button class="btn" onclick="copySummary()">Copy report</button></div>`}else html+=s.items.map(x=>`<article class="item">${x[3]?`<span class="tag ${x[3]==='red'?'red':''}">${x[3]==='red'?'Potential emergency':'Important finding'}</span>`:''}<h3>${esc(x[1])}</h3><p>${esc(x[2])}</p>${suppliedECGFigure(x[0])||ecgFigure(x[0])}<div class="choices">${[['absent','Absent'],['present','Present'],['uncertain','Uncertain']].map(([v,l])=>`<button class="choice ${v==='present'?'abnormal':''}" data-selected="${state.answers[x[0]]===v}" onclick="setAnswer('${x[0]}','${v}')">${l}</button>`).join('')}</div></article>`).join('');html+=`<div class="footer"><button class="btn" ${index===0?'disabled':''} onclick="go(${index-1})">← Previous</button><button class="btn primary" ${index===steps.length-1?'disabled':''} onclick="go(${index+1})">${index===steps.length-2?'Review summary':'Next step →'}</button></div>`;el('screen').innerHTML=html}function report(){let lines=['SYNCOPE ECG ASSESSMENT',...Object.entries(state.patient).map(([k,v])=>`${k.toUpperCase()}: ${v}`),''];steps.slice(0,-1).forEach(s=>{lines.push(s.title);s.items.forEach(x=>lines.push(`- ${x[1]}: ${state.answers[x[0]]||'not assessed'}`));lines.push('')});lines.push('Clinical context: '+state.clinical,'ECG interpretation / plan: '+state.notes,'','Clinical decision support only. Correlate with history, examination, ECG and local emergency pathways.');return lines.join('\n')}function printReport(){el('printArea').innerHTML='<h1>Syncope ECG Assessment</h1><pre style="font:12px/1.55 Arial;white-space:pre-wrap">'+esc(report())+'</pre>';window.print()}function exportJSON(){let blob=new Blob([JSON.stringify({schema:'syncope-ecg-v1',createdAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='syncope-ecg-assessment.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function copySummary(){if(navigator.clipboard && navigator.clipboard.writeText){navigator.clipboard.writeText(report()).then(()=>alert('Report copied')).catch(()=>fallbackCopy())}else fallbackCopy()}function fallbackCopy(){let t=document.createElement('textarea');t.value=report();document.body.appendChild(t);t.select();try{document.execCommand('copy');alert('Report copied')}catch(e){alert('Copy unavailable; use Print or Export JSON')}t.remove()}render();</script></body></html>
